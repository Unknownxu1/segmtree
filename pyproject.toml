[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "segmtree"
version = "0.3.0"
description = "Interpretable unsupervised decision tree for customer segmentation and rule-based clustering."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "The segmtree authors" }]
keywords = [
    "clustering",
    "decision-tree",
    "unsupervised-learning",
    "customer-segmentation",
    "interpretable-ml",
    "clustering-tree",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "scikit-learn>=1.1",
    "pandas>=1.5",
]

[project.urls]
Homepage = "https://github.com/segmtree/segmtree"

[tool.hatch.build.targets.wheel]
packages = ["src/segmtree"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "README.md",
    "README.zh-CN.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "NPY", "RUF"]
