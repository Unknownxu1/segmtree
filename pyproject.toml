[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "segmtree"
dynamic = ["version"]
description = "Interpretable unsupervised decision tree for customer segmentation and rule-based clustering."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Unknownxu1", email = "Unknownxu1@users.noreply.github.com" }]
keywords = [
    "clustering",
    "decision-tree",
    "unsupervised-learning",
    "customer-segmentation",
    "interpretable-ml",
    "clustering-tree",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "scikit-learn>=1.1",
    "pandas>=1.5",
    "build>=1.0",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/Unknownxu1/segmtree"
Repository = "https://github.com/Unknownxu1/segmtree"
Issues = "https://github.com/Unknownxu1/segmtree/issues"

[tool.hatch.version]
path = "src/segmtree/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/segmtree"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "README.md",
    "README.en.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -ra"

[tool.coverage.run]
source = ["segmtree"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "NPY", "RUF"]
